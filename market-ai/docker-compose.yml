version: '3.9'

services:

  # قاعدة البيانات PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: market_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketai
      POSTGRES_PASSWORD: marketai_secret
      POSTGRES_DB: marketai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketai -d marketai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # خادم Node.js الخلفي
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: market_ai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://marketai:marketai_secret@db:5432/marketai_db"
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # محرك الذكاء الاصطناعي Python
  ai_engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: market_ai_python
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://marketai:marketai_secret@db:5432/marketai_db"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ai_engine:/app

  # واجهة المستخدم Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: market_ai_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: market_ai_network
